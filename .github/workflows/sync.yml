name: Sync Humanitix attendees to Mailchimp

on:
  schedule:
    # Every 3 hours. Registrations don't come in fast enough to need tighter
    # polling, and this keeps GitHub Actions minutes usage minimal (~240
    # runs/month vs 4,320 at a 10-minute interval). Use "Sync now" in the
    # control panel for anything time-sensitive, like right before a send.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full backfill (sync every attendee ever, not just new ones)"
        type: boolean
        default: false
      wait:
        description: "Wait for Mailchimp batch to finish and report results"
        type: boolean
        default: true
      dryRun:
        description: "Dry run - preview only, writes nothing to Mailchimp"
        type: boolean
        default: false
      showDetails:
        description: "Dry run only: show per-attendee emails/answers in the log (exposes personal data if this repo's Actions logs are public)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: humanitix-mailchimp-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run sync
        env:
          # Secrets: sensitive, write-only, set once in GitHub's own UI.
          HUMANITIX_API_KEY: ${{ secrets.HUMANITIX_API_KEY }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
          # Variables: not sensitive, readable/editable from docs/index.html (the control panel).
          HUMANITIX_EVENT_IDS: ${{ vars.HUMANITIX_EVENT_IDS }}
          MAILCHIMP_LIST_ID: ${{ vars.MAILCHIMP_LIST_ID }}
          MAILCHIMP_STATUS_IF_NEW: ${{ vars.MAILCHIMP_STATUS_IF_NEW }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.full }}" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ "${{ github.event.inputs.wait }}" != "false" ]; then ARGS="$ARGS --wait"; fi
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.showDetails }}" = "true" ]; then ARGS="$ARGS --show-details"; fi
          node src/sync.js $ARGS

      # state.json tracks "last synced" per event so incremental runs don't
      # re-process old orders. Commit it back so the next scheduled run sees it.
      # Skipped entirely on a dry run, since nothing should be marked as synced.
      - name: Commit updated state
        if: github.event.inputs.dryRun != 'true'
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "Update sync state [skip ci]"
          git push || true
